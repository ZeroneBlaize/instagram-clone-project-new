name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm run install:all
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: License compliance audit
        run: npm run check:licenses
      - name: Run server unit & API integration tests
        run: npm test
      - name: Build server & client
        run: npm run build
